<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Arcade Multi - Socket.io</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 10px; }
    #status {
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #f39c12;
    }
    #player-info {
      margin-bottom: 15px;
      font-size: 14px;
      color: #bdc3c7;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }
    canvas {
      border: 4px solid #444;
      background-color: #85C1E9;
      display: block;
    }
    /* 다시하기 오버레이 UI */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #winner-text {
      font-size: 28px;
      font-weight: bold;
      color: #f1c40f;
      margin-bottom: 20px;
    }
    #restart-btn {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #restart-btn:hover {
      background-color: #27ae60;
    }
  </style>
</head>
<body>

  <h1>Web Crazy Arcade (2P Multi)</h1>
  <div id="status">서버 연결 중...</div>
  <div id="player-info">
    <span>조작법: 방향키(이동) / Space(물풍선)</span>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="overlay">
      <div id="winner-text">Player 1 승리!</div>
      <button id="restart-btn" onclick="requestRestart()">다시하기</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const playerInfoDiv = document.getElementById('player-info');
    const overlay = document.getElementById('overlay');
    const winnerText = document.getElementById('winner-text');

    const ROWS = 15;
    const COLS = 15;
    const TILE_SIZE = canvas.width / COLS;

    const TILE = {
      EMPTY: 0,
      SOLID_BLOCK: 1,
      SOFT_BLOCK: 2,
      BOMB: 3,
      ITEM_BOMB: 4,
      ITEM_RANGE: 5
    };

    let myId = null;
    let gameState = {
      map: [],
      players: {},
      explosions: []
    };

    socket.on('connect', () => {
      statusDiv.innerText = '서버에 연결되었습니다. 다른 플레이어를 기다리는 중...';
    });

    socket.on('full', (msg) => {
      alert(msg);
      statusDiv.innerText = '방이 가득 차서 접속할 수 없습니다.';
    });

    socket.on('init', (data) => {
      myId = data.id;
      gameState.map = data.map;
      gameState.players = data.players;
      updateStatus();
    });

    socket.on('playerJoined', (player) => {
      gameState.players[player.id] = player;
      updateStatus();
    });

    socket.on('playerLeft', (id) => {
      delete gameState.players[id];
      overlay.style.display = 'none';
      updateStatus();
      statusDiv.innerText = '상대방이 나가 대기 상태로 전환되었습니다.';
    });

    socket.on('gameState', (state) => {
      gameState = state;
      updateStatus();
      draw();
    });

    socket.on('gameOver', (data) => {
      winnerText.innerText = `${data.winner} 승리!`;
      overlay.style.display = 'flex';
    });

    socket.on('gameRestarted', () => {
      overlay.style.display = 'none';
    });

    function requestRestart() {
      socket.emit('restartGame');
    }

    function updateStatus() {
      const pCount = Object.keys(gameState.players).length;
      const me = gameState.players[myId];

      if (me) {
        statusDiv.innerText = `접속 완료 (당신: Player ${me.pNum}) | 접속자 수: ${pCount}/2`;
        playerInfoDiv.innerText = `내 스탯 - 최대 물풍선: ${me.maxBombs} | 폭발 사거리: ${me.bombRange} | 상태: ${me.isAlive ? '생존' : '사망'}`;
      }
    }

    const keysPressed = {};
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === ' ') {
        socket.emit('placeBomb');
        return;
      }

      if (!keysPressed[e.key]) {
        keysPressed[e.key] = true;
        sendMoveSignal(e.key);
      }
    });

    window.addEventListener('keyup', (e) => {
      delete keysPressed[e.key];
    });

    function sendMoveSignal(key) {
      if (key === 'ArrowUp') socket.emit('move', 'up');
      if (key === 'ArrowDown') socket.emit('move', 'down');
      if (key === 'ArrowLeft') socket.emit('move', 'left');
      if (key === 'ArrowRight') socket.emit('move', 'right');
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (gameState.map && gameState.map.length > 0) {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const type = gameState.map[r][c];

            if (type === TILE.SOLID_BLOCK) {
              ctx.fillStyle = '#2C3E50';
              ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            } else if (type === TILE.SOFT_BLOCK) {
              ctx.fillStyle = '#D35400';
              ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE - 2, TILE_SIZE - 2);
            } else if (type === TILE.BOMB) {
              ctx.fillStyle = '#2980B9';
              ctx.beginPath();
              ctx.arc(c * TILE_SIZE + TILE_SIZE / 2, r * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE / 2.5, 0, Math.PI * 2);
              ctx.fill();
            } else if (type === TILE.ITEM_BOMB) {
              ctx.fillStyle = '#F1C40F';
              ctx.fillRect(c * TILE_SIZE + 10, r * TILE_SIZE + 10, TILE_SIZE - 20, TILE_SIZE - 20);
            } else if (type === TILE.ITEM_RANGE) {
              ctx.fillStyle = '#E67E22';
              ctx.fillRect(c * TILE_SIZE + 10, r * TILE_SIZE + 10, TILE_SIZE - 20, TILE_SIZE - 20);
            }
          }
        }
      }

      if (gameState.explosions) {
        ctx.fillStyle = '#E74C3C';
        gameState.explosions.forEach(exp => {
          ctx.fillRect(exp.x * TILE_SIZE, exp.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        });
      }

      if (gameState.players) {
        Object.values(gameState.players).forEach(p => {
          if (!p.isAlive) return;

          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x * TILE_SIZE + TILE_SIZE / 2, p.y * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE / 3, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 12px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(`P${p.pNum}`, p.x * TILE_SIZE + TILE_SIZE / 2, p.y * TILE_SIZE + TILE_SIZE / 2 + 4);
        });
      }
    }
  </script>
</body>
</html>
