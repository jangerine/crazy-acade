<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Arcade Online 💣</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      background: #0d1b2a;
      color: #fff;
      font-family: 'Jua', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* 크크아 스타일 타이틀 */
    .title-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
      font-size: 36px;
      color: #00d2ff;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 5px 0 #0056b3;
      letter-spacing: 1px;
    }

    /* 대기실 상단 컨트롤 */
    #lobby-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
      background: #1b263b;
      padding: 8px 20px;
      border-radius: 30px;
      border: 3px solid #415a77;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    select, button {
      font-family: 'Jua', sans-serif;
      font-size: 16px;
      padding: 6px 16px;
      border-radius: 20px;
      border: none;
      outline: none;
    }
    select {
      background: #0d1b2a;
      color: #00d2ff;
      border: 2px solid #00d2ff;
      cursor: pointer;
    }
    #start-btn {
      background: linear-gradient(180deg, #ffcc00 0%, #ff9900 100%);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #cc6600;
      transition: all 0.1s;
    }
    #start-btn:hover:not(:disabled) { transform: translateY(-1px); }
    #start-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #cc6600; }
    #start-btn:disabled { background: #555; color: #888; box-shadow: none; cursor: not-allowed; }

    #status {
      margin-bottom: 10px;
      font-size: 15px;
      color: #ffcc00;
      text-shadow: 1px 1px 2px #000;
    }

    /* 🎮 크아 게임기 프레임 레이아웃 */
    #arcade-frame {
      display: flex;
      background: #2a6f97;
      border: 6px solid #014f86;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,255,255,0.2);
      gap: 12px;
    }

    /* 좌/우 유저 패널 */
    .user-panel {
      width: 130px;
      background: #012a4a;
      border: 3px solid #014f86;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .panel-title {
      font-size: 16px;
      color: #89c2d9;
      border-bottom: 2px solid #014f86;
      width: 100%;
      text-align: center;
      padding-bottom: 4px;
    }
    .avatar-box {
      width: 80px;
      height: 80px;
      background: #014f86;
      border: 3px solid #2a6f97;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .stat-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
    }
    .stat-item {
      display: flex;
      justify-content: space-between;
      background: #013a63;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid #2a6f97;
    }

    /* 메인 캔버스 뷰 */
    #canvas-container {
      position: relative;
      border: 4px solid #012a4a;
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background-color: #2a6f97;
    }

    /* 승리/패배 모달 */
    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(1, 42, 74, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #winner-text {
      font-size: 36px;
      color: #ffcc00;
      margin-bottom: 20px;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
    }
    .lobby-btn {
      background: linear-gradient(180deg, #00d2ff 0%, #0066cc 100%);
      color: white;
      padding: 10px 24px;
      font-size: 18px;
      font-family: 'Jua', sans-serif;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 0 #003366;
    }
  </style>
</head>
<body>

  <div class="title-container">
    <h1>CRAZY ARCADE BnB</h1>
  </div>

  <div id="lobby-controls">
    <label for="mapSelect">⛺ 맵:</label>
    <select id="mapSelect" onchange="onMapChange()">
      <option value="camp">캠프 (Camp)</option>
      <option value="patrit">패트릿 (Patrit)</option>
      <option value="factory">팩토리 (Factory)</option>
    </select>
    <button id="start-btn" onclick="startGame()">START</button>
  </div>

  <div id="status">서버 연결 중...</div>

  <!-- 🎮 크아 게임 화면 프레임 (좌/우 유저 상태창 + 맵) -->
  <div id="arcade-frame">
    <!-- P1 패널 -->
    <div class="user-panel">
      <div class="panel-title">PLAYER 1</div>
      <div class="avatar-box" id="p1-avatar">🔴</div>
      <div class="stat-list">
        <div class="stat-item"><span>🎈 풍선</span><span id="p1-bombs" style="color:#60a5fa">1</span></div>
        <div class="stat-item"><span>🔥 줄기</span><span id="p1-range" style="color:#f87171">1</span></div>
        <div class="stat-item"><span>🛼 스피드</span><span id="p1-speed" style="color:#34d399">1</span></div>
      </div>
    </div>

    <!-- 맵 캔버스 -->
    <div id="canvas-container">
      <canvas id="gameCanvas" width="525" height="525"></canvas>

      <div id="overlay">
        <div id="winner-text">Player 1 승리!</div>
        <button class="lobby-btn" onclick="requestLobby()">대기실로 이동</button>
      </div>
    </div>

    <!-- P2 패널 -->
    <div class="user-panel">
      <div class="panel-title">PLAYER 2</div>
      <div class="avatar-box" id="p2-avatar">🔵</div>
      <div class="stat-list">
        <div class="stat-item"><span>🎈 풍선</span><span id="p2-bombs" style="color:#60a5fa">1</span></div>
        <div class="stat-item"><span>🔥 줄기</span><span id="p2-range" style="color:#f87171">1</span></div>
        <div class="stat-item"><span>🛼 스피드</span><span id="p2-speed" style="color:#34d399">1</span></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const mapSelect = document.getElementById('mapSelect');
    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');
    const overlay = document.getElementById('overlay');

    const ROWS = 15;
    const COLS = 15;
    const TILE_SIZE = canvas.width / COLS;

    const TILE = {
      EMPTY: 0,
      SOLID_BLOCK: 1,
      SOFT_BLOCK: 2,
      BOMB: 3,
      ITEM_BOMB: 4,
      ITEM_RANGE: 5,
      ITEM_SPEED: 6
    };

    let myId = null;
    let isGameStarted = false;
    let gameState = { map: [], players: {}, explosions: [] };

    let localPositions = {};
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    let myActiveBombs = [];

    socket.on('init', (data) => {
      myId = data.id;
      gameState.map = data.map;
      gameState.players = data.players;
      isGameStarted = data.isGameStarted;
      mapSelect.value = data.selectedMap;

      syncLocalPositions();
      updateLobbyUI();
      requestAnimationFrame(clientLoop);
    });

    socket.on('playerJoined', (player) => {
      gameState.players[player.id] = player;
      localPositions[player.id] = { x: player.x * TILE_SIZE, y: player.y * TILE_SIZE };
      updateLobbyUI();
    });

    socket.on('playerLeft', (id) => {
      delete gameState.players[id];
      delete localPositions[id];
      updateLobbyUI();
    });

    socket.on('mapChanged', (data) => {
      mapSelect.value = data.selectedMap;
      gameState.map = data.map;
    });

    socket.on('gameStarted', (data) => {
      isGameStarted = true;
      overlay.style.display = 'none';
      gameState.map = data.map;
      gameState.players = data.players;
      myActiveBombs = [];
      syncLocalPositions();
      updateLobbyUI();
    });

    socket.on('gameState', (state) => {
      gameState.map = state.map;
      gameState.explosions = state.explosions;
      myActiveBombs = myActiveBombs.filter(b => gameState.map[b.r] && gameState.map[b.r][b.c] === TILE.BOMB);

      Object.keys(state.players).forEach(id => {
        if (gameState.players[id]) {
          gameState.players[id].x = state.players[id].x;
          gameState.players[id].y = state.players[id].y;
          gameState.players[id].maxBombs = state.players[id].maxBombs;
          gameState.players[id].bombRange = state.players[id].bombRange;
          gameState.players[id].speed = state.players[id].speed || 1;
          gameState.players[id].isAlive = state.players[id].isAlive;

          if (id !== myId && localPositions[id]) {
            localPositions[id].targetX = state.players[id].x * TILE_SIZE;
            localPositions[id].targetY = state.players[id].y * TILE_SIZE;
          }
        }
      });
      updateHUD();
    });

    socket.on('gameOver', (data) => {
      document.getElementById('winner-text').innerText = `${data.winner} 승리!`;
      overlay.style.display = 'flex';
    });

    socket.on('returnToLobby', (data) => {
      isGameStarted = false;
      overlay.style.display = 'none';
      gameState.map = data.map;
      gameState.players = data.players;
      myActiveBombs = [];
      syncLocalPositions();
      updateLobbyUI();
    });

    function syncLocalPositions() {
      Object.values(gameState.players).forEach(p => {
        localPositions[p.id] = {
          x: p.x * TILE_SIZE,
          y: p.y * TILE_SIZE,
          targetX: p.x * TILE_SIZE,
          targetY: p.y * TILE_SIZE
        };
      });
    }

    function onMapChange() { socket.emit('selectMap', mapSelect.value); }
    function startGame() { socket.emit('startGame'); }
    function requestLobby() { socket.emit('restartGame'); }

    function updateLobbyUI() {
      const me = gameState.players[myId];
      const isHost = me && me.pNum === 1;
      mapSelect.disabled = isGameStarted || !isHost;
      startBtn.disabled = isGameStarted || !isHost;

      if (!isGameStarted) {
        statusDiv.innerText = isHost ? `[방장] 맵을 선택하고 [START]를 누르세요.` : `[참가자] 방장의 게임 시작을 기다리는 중...`;
      } else {
        statusDiv.innerText = `게임 진행 중 (Player ${me ? me.pNum : ''})`;
      }
    }

    function updateHUD() {
      Object.values(gameState.players).forEach(p => {
        const prefix = `p${p.pNum}`;
        const bEl = document.getElementById(`${prefix}-bombs`);
        const rEl = document.getElementById(`${prefix}-range`);
        const sEl = document.getElementById(`${prefix}-speed`);
        if (bEl) bEl.innerText = p.maxBombs;
        if (rEl) rEl.innerText = p.bombRange;
        if (sEl) sEl.innerText = p.speed || 1;
      });
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
      
      if (e.key === ' ') {
        if (!isGameStarted || !localPositions[myId]) return;
        const myPos = localPositions[myId];
        const centerCol = Math.floor((myPos.x + TILE_SIZE / 2) / TILE_SIZE);
        const centerRow = Math.floor((myPos.y + TILE_SIZE / 2) / TILE_SIZE);

        if (gameState.map[centerRow] && gameState.map[centerRow][centerCol] !== TILE.BOMB) {
          if (!myActiveBombs.some(b => b.r === centerRow && b.c === centerCol)) {
            myActiveBombs.push({ r: centerRow, c: centerCol });
          }
          socket.emit('placeBomb');
        }
        return;
      }

      if (e.key in keys) keys[e.key] = true;
    });

    window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

    let lastServerSyncTime = 0;

    function updateMovement() {
      if (!isGameStarted) return;
      const me = gameState.players[myId];
      if (!me || !me.isAlive || !localPositions[myId]) return;

      const myPos = localPositions[myId];
      const speedLevel = me.speed || 1;
      const moveSpeed = 2.0 + (speedLevel - 1) * 0.5;

      let dx = 0;
      let dy = 0;

      if (keys.ArrowUp) dy -= moveSpeed;
      if (keys.ArrowDown) dy += moveSpeed;
      if (keys.ArrowLeft) dx -= moveSpeed;
      if (keys.ArrowRight) dx += moveSpeed;

      const hitSize = TILE_SIZE * 0.6;
      const margin = (TILE_SIZE - hitSize) / 2;
      checkBombOverlap(myPos.x + margin, myPos.y + margin, hitSize);

      if (dx !== 0 || dy !== 0) {
        let nextX = myPos.x + dx;
        let nextY = myPos.y + dy;

        if (canMoveTo(nextX + margin, myPos.y + margin, hitSize)) {
          myPos.x = nextX;
        }
        if (canMoveTo(myPos.x + margin, nextY + margin, hitSize)) {
          myPos.y = nextY;
        }

        myPos.x = Math.max(0, Math.min(canvas.width - TILE_SIZE, myPos.x));
        myPos.y = Math.max(0, Math.min(canvas.height - TILE_SIZE, myPos.y));

        const now = Date.now();
        if (now - lastServerSyncTime > 80) {
          let dir = null;
          if (keys.ArrowUp) dir = 'up';
          else if (keys.ArrowDown) dir = 'down';
          else if (keys.ArrowLeft) dir = 'left';
          else if (keys.ArrowRight) dir = 'right';

          if (dir) socket.emit('move', dir);
          lastServerSyncTime = now;
        }
      }

      Object.keys(localPositions).forEach(id => {
        if (id !== myId) {
          const pos = localPositions[id];
          if (pos.targetX !== undefined) {
            pos.x += (pos.targetX - pos.x) * 0.35;
            pos.y += (pos.targetY - pos.y) * 0.35;
          }
        }
      });
    }

    function checkBombOverlap(x, y, size) {
      const minCol = Math.floor(x / TILE_SIZE);
      const maxCol = Math.floor((x + size - 1) / TILE_SIZE);
      const minRow = Math.floor(y / TILE_SIZE);
      const maxRow = Math.floor((y + size - 1) / TILE_SIZE);

      myActiveBombs = myActiveBombs.filter(b => {
        const overlaps = (r, c) => r >= minRow && r <= maxRow && c >= minCol && c <= maxCol;
        return overlaps(b.r, b.c);
      });
    }

    function canMoveTo(x, y, size) {
      const minCol = Math.floor(x / TILE_SIZE);
      const maxCol = Math.floor((x + size - 1) / TILE_SIZE);
      const minRow = Math.floor(y / TILE_SIZE);
      const maxRow = Math.floor((y + size - 1) / TILE_SIZE);

      for (let r = minRow; r <= maxRow; r++) {
        for (let c = minCol; c <= maxCol; c++) {
          if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;

          const tile = gameState.map[r] ? gameState.map[r][c] : TILE.SOLID_BLOCK;

          if (tile === TILE.SOLID_BLOCK || tile === TILE.SOFT_BLOCK) return false;

          if (tile === TILE.BOMB) {
            const isInsideMyBomb = myActiveBombs.some(b => b.r === r && b.c === c);
            if (!isInsideMyBomb) return false;
          }
        }
      }
      return true;
    }

    function clientLoop() {
      updateMovement();
      draw();
      requestAnimationFrame(clientLoop);
    }

    // 🎨 크아 원작풍 맵 배경
    function drawBackground() {
      const theme = mapSelect.value;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = c * TILE_SIZE;
          const y = r * TILE_SIZE;

          if (theme === 'camp') {
            ctx.fillStyle = (r + c) % 2 === 0 ? '#60d394' : '#52b788';
          } else if (theme === 'patrit') {
            ctx.fillStyle = (r + c) % 2 === 0 ? '#ee9b00' : '#ca6702';
          } else {
            ctx.fillStyle = (r + c) % 2 === 0 ? '#8d99ae' : '#7371fc';
          }
          ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        }
      }
    }

    // 🎨 크아 원작 스타일 블록
    function drawSolidBlock(c, r) {
      const x = c * TILE_SIZE;
      const y = r * TILE_SIZE;
      const theme = mapSelect.value;

      if (theme === 'camp') {
        // 캠프 나무 텐트
        ctx.fillStyle = '#d90429';
        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        ctx.fillStyle = '#ef233c';
        ctx.fillRect(x + 5, y + 5, TILE_SIZE - 10, TILE_SIZE - 10);
        ctx.fillStyle = '#fff';
        ctx.fillRect(x + TILE_SIZE / 2 - 3, y + 8, 6, TILE_SIZE - 16);
      } else {
        ctx.fillStyle = '#2b2d42';
        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        ctx.strokeStyle = '#8d99ae';
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 4, y + 4, TILE_SIZE - 8, TILE_SIZE - 8);
      }
    }

    function drawSoftBlock(c, r) {
      const x = c * TILE_SIZE;
      const y = r * TILE_SIZE;
      ctx.fillStyle = '#ffb703';
      ctx.fillRect(x + 3, y + 3, TILE_SIZE - 6, TILE_SIZE - 6);
      ctx.strokeStyle = '#fb8500';
      ctx.lineWidth = 3;
      ctx.strokeRect(x + 5, y + 5, TILE_SIZE - 10, TILE_SIZE - 10);
    }

    // 🎨 크아 특유의 왕물풍선
    function drawBomb(c, r) {
      const x = c * TILE_SIZE + TILE_SIZE / 2;
      const y = r * TILE_SIZE + TILE_SIZE / 2;
      const scale = 1 + Math.sin(Date.now() / 120) * 0.08;
      const radius = (TILE_SIZE / 2.3) * scale;

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(x, y + radius * 0.7, radius * 0.8, radius * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      // 물방울 몸통
      ctx.fillStyle = '#00b4d8';
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#90e0ef';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 크아 특유의 하얀 반사광
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x - radius * 0.3, y - radius * 0.3, radius * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }

    // 🎨 크아 원작 아이템 바구니
    function drawItem(c, r, bgColor, symbol) {
      const x = c * TILE_SIZE;
      const y = r * TILE_SIZE;
      const floatY = Math.sin(Date.now() / 180) * 2;

      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.roundRect(x + 4, y + 4 + floatY, TILE_SIZE - 8, TILE_SIZE - 8, 8);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(symbol, x + TILE_SIZE / 2, y + TILE_SIZE / 2 + floatY);
    }

    // 🎨 크아 캐릭터 스킨 (배찌/다오 느낌)
    function drawPlayer(p, pos) {
      const x = pos.x + TILE_SIZE / 2;
      const y = pos.y + TILE_SIZE / 2;
      const radius = TILE_SIZE / 2.5;

      // 그림자
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(x, y + radius * 0.8, radius * 0.7, radius * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      // 대가리/모자
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 얼굴 면적 (크아 캐릭터 피부색)
      ctx.fillStyle = '#ffe0bd';
      ctx.beginPath();
      ctx.arc(x, y + 2, radius * 0.65, 0, Math.PI * 2);
      ctx.fill();

      // 눈
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(x - 5, y, 2.5, 0, Math.PI * 2);
      ctx.arc(x + 5, y, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // 볼터치
      ctx.fillStyle = '#ff85a1';
      ctx.beginPath();
      ctx.arc(x - 8, y + 4, 2.5, 0, Math.PI * 2);
      ctx.arc(x + 8, y + 4, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();

      if (gameState.map && gameState.map.length > 0) {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const type = gameState.map[r][c];
            if (type === TILE.SOLID_BLOCK) drawSolidBlock(c, r);
            else if (type === TILE.SOFT_BLOCK) drawSoftBlock(c, r);
            else if (type === TILE.BOMB) drawBomb(c, r);
            else if (type === TILE.ITEM_BOMB) drawItem(c, r, '#0077b6', '🎈');
            else if (type === TILE.ITEM_RANGE) drawItem(c, r, '#d90429', '🔥');
            else if (type === TILE.ITEM_SPEED) drawItem(c, r, '#38b000', '🛼');
          }
        }
      }

      // 폭발 이펙트 (십자가 물줄기 느낌)
      if (gameState.explosions) {
        ctx.fillStyle = '#48cae4';
        gameState.explosions.forEach(exp => {
          ctx.fillRect(exp.x * TILE_SIZE + 2, exp.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        });
      }

      // 플레이어
      if (gameState.players) {
        Object.values(gameState.players).forEach(p => {
          if (!p.isAlive) return;
          const pos = localPositions[p.id] || { x: p.x * TILE_SIZE, y: p.y * TILE_SIZE };
          drawPlayer(p, pos);
        });
      }
    }
  </script>
</body>
</html>
