<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Arcade Online 💣</title>
  <style>
    body {
      background-color: #121820;
      color: #fff;
      font-family: 'Malgun Gothic', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 {
      margin: 10px 0;
      color: #4cc9f0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }
    #lobby-controls {
      display: flex;
      gap: 15px;
      margin-bottom: 12px;
      align-items: center;
      background: #1f2937;
      padding: 12px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 1px solid #374151;
    }
    select, button {
      padding: 8px 16px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    select { background: #374151; color: white; }
    #start-btn { background-color: #4338ca; color: #fff; }
    #start-btn:hover { background-color: #4f46e5; }
    #start-btn:disabled { background-color: #4b5563; cursor: not-allowed; opacity: 0.6; }

    #status {
      margin-bottom: 12px;
      font-size: 15px;
      color: #f59e0b;
      font-weight: bold;
    }

    #game-container { position: relative; }

    #hud {
      display: flex;
      justify-content: space-around;
      width: 600px;
      background: #111827;
      border: 3px solid #1f2937;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 8px 0;
      box-sizing: border-box;
    }
    .hud-card {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: bold;
      background: #1f2937;
      padding: 4px 12px;
      border-radius: 6px;
    }

    canvas {
      border: 4px solid #1f2937;
      background-color: #4b7bec;
      display: block;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
    #winner-text { font-size: 32px; color: #f59e0b; margin-bottom: 20px; font-weight: bold; }
    .lobby-btn { background: #10b981; color: white; padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>

  <h1>Crazy Arcade Online 💣</h1>

  <div id="lobby-controls">
    <label for="mapSelect">⛺ 맵 선택:</label>
    <select id="mapSelect" onchange="onMapChange()">
      <option value="camp">캠프 (Camp)</option>
      <option value="patrit">패트릿 (Patrit)</option>
      <option value="factory">팩토리 (Factory)</option>
    </select>
    <button id="start-btn" onclick="startGame()">게임 시작</button>
  </div>

  <div id="status">서버 연결 중...</div>

  <div id="game-container">
    <div id="hud">
      <div class="hud-card">🎈 물풍선: <span id="hud-bombs" style="color:#60a5fa">1</span></div>
      <div class="hud-card">🔥 물줄기: <span id="hud-range" style="color:#f87171">1</span></div>
      <div class="hud-card">🛼 스피드: <span id="hud-speed" style="color:#34d399">1</span></div>
    </div>

    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <div id="overlay">
      <div id="winner-text">Player 1 승리!</div>
      <button class="lobby-btn" onclick="requestLobby()">대기실로 이동</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const mapSelect = document.getElementById('mapSelect');
    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');
    const overlay = document.getElementById('overlay');

    const ROWS = 15;
    const COLS = 15;
    const TILE_SIZE = canvas.width / COLS;

    const TILE = {
      EMPTY: 0,
      SOLID_BLOCK: 1,
      SOFT_BLOCK: 2,
      BOMB: 3,
      ITEM_BOMB: 4,
      ITEM_RANGE: 5,
      ITEM_SPEED: 6
    };

    let myId = null;
    let isGameStarted = false;
    let gameState = { map: [], players: {}, explosions: [] };

    // 부드러운 위치 렌더링을 위한 픽셀 단위 실시간 위치 데이터
    let localPositions = {};

    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

    socket.on('init', (data) => {
      myId = data.id;
      gameState.map = data.map;
      gameState.players = data.players;
      isGameStarted = data.isGameStarted;
      mapSelect.value = data.selectedMap;

      syncLocalPositions();
      updateLobbyUI();
      requestAnimationFrame(clientLoop);
    });

    socket.on('playerJoined', (player) => {
      gameState.players[player.id] = player;
      localPositions[player.id] = { x: player.x * TILE_SIZE, y: player.y * TILE_SIZE };
      updateLobbyUI();
    });

    socket.on('playerLeft', (id) => {
      delete gameState.players[id];
      delete localPositions[id];
      updateLobbyUI();
    });

    socket.on('mapChanged', (data) => {
      mapSelect.value = data.selectedMap;
      gameState.map = data.map;
    });

    socket.on('gameStarted', (data) => {
      isGameStarted = true;
      overlay.style.display = 'none';
      gameState.map = data.map;
      gameState.players = data.players;
      syncLocalPositions();
      updateLobbyUI();
    });

    socket.on('gameState', (state) => {
      gameState.map = state.map;
      gameState.explosions = state.explosions;

      Object.keys(state.players).forEach(id => {
        if (gameState.players[id]) {
          gameState.players[id].x = state.players[id].x;
          gameState.players[id].y = state.players[id].y;
          gameState.players[id].maxBombs = state.players[id].maxBombs;
          gameState.players[id].bombRange = state.players[id].bombRange;
          gameState.players[id].speed = state.players[id].speed || 1;
          gameState.players[id].isAlive = state.players[id].isAlive;

          // 나 이외의 플레이어는 서버 위치로 부드럽게 보간(Lerp)
          if (id !== myId && localPositions[id]) {
            const targetX = state.players[id].x * TILE_SIZE;
            const targetY = state.players[id].y * TILE_SIZE;
            localPositions[id].targetX = targetX;
            localPositions[id].targetY = targetY;
          }
        }
      });
      updateHUD();
    });

    socket.on('gameOver', (data) => {
      document.getElementById('winner-text').innerText = `${data.winner} 승리!`;
      overlay.style.display = 'flex';
    });

    socket.on('returnToLobby', (data) => {
      isGameStarted = false;
      overlay.style.display = 'none';
      gameState.map = data.map;
      gameState.players = data.players;
      syncLocalPositions();
      updateLobbyUI();
    });

    function syncLocalPositions() {
      Object.values(gameState.players).forEach(p => {
        localPositions[p.id] = {
          x: p.x * TILE_SIZE,
          y: p.y * TILE_SIZE,
          targetX: p.x * TILE_SIZE,
          targetY: p.y * TILE_SIZE
        };
      });
    }

    function onMapChange() { socket.emit('selectMap', mapSelect.value); }
    function startGame() { socket.emit('startGame'); }
    function requestLobby() { socket.emit('restartGame'); }

    function updateLobbyUI() {
      const me = gameState.players[myId];
      const isHost = me && me.pNum === 1;
      mapSelect.disabled = isGameStarted || !isHost;
      startBtn.disabled = isGameStarted || !isHost;

      if (!isGameStarted) {
        statusDiv.innerText = isHost ? `[방장] 맵을 선택하고 [게임 시작]을 누르세요.` : `[참가자] 방장의 게임 시작을 기다리는 중...`;
      } else {
        statusDiv.innerText = `게임 진행 중 (Player ${me ? me.pNum : ''})`;
      }
    }

    function updateHUD() {
      const me = gameState.players[myId];
      if (me) {
        document.getElementById('hud-bombs').innerText = me.maxBombs;
        document.getElementById('hud-range').innerText = me.bombRange;
        document.getElementById('hud-speed').innerText = me.speed || 1;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
      if (e.key === ' ') { socket.emit('placeBomb'); return; }
      if (e.key in keys) keys[e.key] = true;
    });

    window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

    let lastServerSyncTime = 0;

    // ✨ 60FPS 프레임 기반 픽셀 단위 연속 이동 로직
    function updateMovement() {
      if (!isGameStarted) return;
      const me = gameState.players[myId];
      if (!me || !me.isAlive || !localPositions[myId]) return;

      const myPos = localPositions[myId];
      const speedLevel = me.speed || 1;
      
      // 스피드 아이템 수치에 따른 이동 속도 (픽셀/프레임)
      const moveSpeed = 2.2 + (speedLevel - 1) * 0.6; 

      let dx = 0;
      let dy = 0;

      if (keys.ArrowUp) dy -= moveSpeed;
      if (keys.ArrowDown) dy += moveSpeed;
      if (keys.ArrowLeft) dx -= moveSpeed;
      if (keys.ArrowRight) dx += moveSpeed;

      if (dx !== 0 || dy !== 0) {
        let nextX = myPos.x + dx;
        let nextY = myPos.y + dy;

        // 충돌 판정 (캐릭터 중심점 기준)
        const size = TILE_SIZE * 0.7;
        const padding = (TILE_SIZE - size) / 2;

        if (canMoveTo(nextX + padding, myPos.y + padding, size) && 
            canMoveTo(nextX + padding, myPos.y + TILE_SIZE - padding - 1, size)) {
          myPos.x = nextX;
        }

        if (canMoveTo(myPos.x + padding, nextY + padding, size) && 
            canMoveTo(myPos.x + TILE_SIZE - padding - 1, nextY + padding, size)) {
          myPos.y = nextY;
        }

        // 실시간 위치 타일 계산 후 서버에 주기적 보정 동기화 (100ms 마다)
        const now = Date.now();
        if (now - lastServerSyncTime > 100) {
          const gridX = Math.round(myPos.x / TILE_SIZE);
          const gridY = Math.round(myPos.y / TILE_SIZE);
          
          let dir = null;
          if (keys.ArrowUp) dir = 'up';
          else if (keys.ArrowDown) dir = 'down';
          else if (keys.ArrowLeft) dir = 'left';
          else if (keys.ArrowRight) dir = 'right';

          if (dir) socket.emit('move', dir);
          lastServerSyncTime = now;
        }
      }

      // 상대방 위치는 부드럽게 보간(Lerp) 적용
      Object.keys(localPositions).forEach(id => {
        if (id !== myId) {
          const pos = localPositions[id];
          if (pos.targetX !== undefined) {
            pos.x += (pos.targetX - pos.x) * 0.3;
            pos.y += (pos.targetY - pos.y) * 0.3;
          }
        }
      });
    }

    // 장애물 및 블록 충돌 검사
    function canMoveTo(x, y, size) {
      const minCol = Math.floor(x / TILE_SIZE);
      const maxCol = Math.floor((x + size) / TILE_SIZE);
      const minRow = Math.floor(y / TILE_SIZE);
      const maxRow = Math.floor((y + size) / TILE_SIZE);

      for (let r = minRow; r <= maxRow; r++) {
        for (let c = minCol; c <= maxCol; c++) {
          if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
          const tile = gameState.map[r] ? gameState.map[r][c] : TILE.SOLID_BLOCK;
          if (tile === TILE.SOLID_BLOCK || tile === TILE.SOFT_BLOCK || tile === TILE.BOMB) {
            return false;
          }
        }
      }
      return true;
    }

    function clientLoop() {
      updateMovement();
      draw();
      requestAnimationFrame(clientLoop);
    }

    function drawItem(c, r, bgColor, iconType) {
      const x = c * TILE_SIZE;
      const y = r * TILE_SIZE;
      const pad = 6;
      const size = TILE_SIZE - pad * 2;

      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.roundRect(x + pad, y + pad, size, size, 8);
      ctx.fill();

      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (iconType === 'BOMB') {
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath();
        ctx.arc(x + TILE_SIZE / 2, y + TILE_SIZE / 2 + 2, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x + TILE_SIZE / 2 - 2, y + TILE_SIZE / 2 - 8, 4, 3);
      } else if (iconType === 'RANGE') {
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText('🔥', x + TILE_SIZE / 2, y + TILE_SIZE / 2);
      } else if (iconType === 'SPEED') {
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText('🛼', x + TILE_SIZE / 2, y + TILE_SIZE / 2);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 맵 및 아이템 그리기
      if (gameState.map && gameState.map.length > 0) {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const type = gameState.map[r][c];

            ctx.fillStyle = (r + c) % 2 === 0 ? '#4ab04a' : '#43a243';
            ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);

            if (type === TILE.SOLID_BLOCK) {
              ctx.fillStyle = '#374151';
              ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
              ctx.strokeStyle = '#1f2937';
              ctx.strokeRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            } else if (type === TILE.SOFT_BLOCK) {
              ctx.fillStyle = '#d97706';
              ctx.fillRect(c * TILE_SIZE + 2, r * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
              ctx.strokeStyle = '#b45309';
              ctx.strokeRect(c * TILE_SIZE + 2, r * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
            } else if (type === TILE.BOMB) {
              ctx.fillStyle = '#2563eb';
              ctx.beginPath();
              ctx.arc(c * TILE_SIZE + TILE_SIZE / 2, r * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE / 2.4, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = '#60a5fa';
              ctx.lineWidth = 3;
              ctx.stroke();
            } else if (type === TILE.ITEM_BOMB) {
              drawItem(c, r, '#2563eb', 'BOMB');
            } else if (type === TILE.ITEM_RANGE) {
              drawItem(c, r, '#dc2626', 'RANGE');
            } else if (type === TILE.ITEM_SPEED) {
              drawItem(c, r, '#059669', 'SPEED');
            }
          }
        }
      }

      // 폭발 효과
      if (gameState.explosions) {
        ctx.fillStyle = '#f87171';
        gameState.explosions.forEach(exp => {
          ctx.fillRect(exp.x * TILE_SIZE, exp.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        });
      }

      // 🏃‍♂️ 캐릭터 픽셀 단위 부드러운 위치 렌더링
      if (gameState.players) {
        Object.values(gameState.players).forEach(p => {
          if (!p.isAlive) return;

          const pos = localPositions[p.id] || { x: p.x * TILE_SIZE, y: p.y * TILE_SIZE };

          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(pos.x + TILE_SIZE / 2, pos.y + TILE_SIZE / 2, TILE_SIZE / 2.8, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 12px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(`P${p.pNum}`, pos.x + TILE_SIZE / 2, pos.y + TILE_SIZE / 2 + 4);
        });
      }
    }
  </script>
</body>
</html>
