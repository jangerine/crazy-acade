<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Arcade - Map Select</title>
  <style>
    body {
      background-color: #1b4332;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    #lobby-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      align-items: center;
      background: #2d6a4f;
      padding: 10px 20px;
      border-radius: 8px;
    }
    select, button {
      padding: 8px 16px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
    #start-btn { background-color: #ffb703; color: #000; }
    #start-btn:disabled { background-color: #6c757d; cursor: not-allowed; }
    #status { margin-bottom: 10px; font-size: 15px; color: #ffb703; }
    #game-container { position: relative; }
    canvas {
      border: 4px solid #2d6a4f;
      background-color: #55a630;
      display: block;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #winner-text { font-size: 28px; color: #ffb703; margin-bottom: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Web Crazy Arcade 💣</h1>
  
  <!-- 🚪 대기실 UI (맵 선택 & 게임 시작) -->
  <div id="lobby-controls">
    <label for="mapSelect">⛺ 맵 선택:</label>
    <select id="mapSelect" onchange="onMapChange()">
      <option value="camp">캠프 (Camp)</option>
      <option value="patrit">패트릿 (Patrit)</option>
      <option value="factory">팩토리 (Factory)</option>
    </select>
    <button id="start-btn" onclick="startGame()">게임 시작</button>
  </div>

  <div id="status">서버 연결 중...</div>

  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="overlay">
      <div id="winner-text">Player 1 승리!</div>
      <button onclick="requestLobby()">대기실로 이동</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const mapSelect = document.getElementById('mapSelect');
    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');
    const overlay = document.getElementById('overlay');

    const ROWS = 15;
    const COLS = 15;
    const TILE_SIZE = canvas.width / COLS;

    const TILE = { EMPTY: 0, SOLID_BLOCK: 1, SOFT_BLOCK: 2, BOMB: 3, ITEM_BOMB: 4, ITEM_RANGE: 5 };

    let myId = null;
    let isGameStarted = false;
    let gameState = { map: [], players: {}, explosions: [] };

    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

    socket.on('init', (data) => {
      myId = data.id;
      gameState.map = data.map;
      gameState.players = data.players;
      isGameStarted = data.isGameStarted;
      mapSelect.value = data.selectedMap;
      
      updateLobbyUI();
      requestAnimationFrame(clientLoop);
    });

    socket.on('playerJoined', (player) => {
      gameState.players[player.id] = player;
      updateLobbyUI();
    });

    socket.on('playerLeft', (id) => {
      delete gameState.players[id];
      updateLobbyUI();
    });

    socket.on('mapChanged', (data) => {
      mapSelect.value = data.selectedMap;
      gameState.map = data.map;
    });

    socket.on('gameStarted', (data) => {
      isGameStarted = true;
      overlay.style.display = 'none';
      gameState.map = data.map;
      gameState.players = data.players;
      updateLobbyUI();
    });

    socket.on('gameState', (state) => {
      gameState.map = state.map;
      gameState.explosions = state.explosions;

      Object.keys(state.players).forEach(id => {
        if (gameState.players[id]) {
          gameState.players[id].x = state.players[id].x;
          gameState.players[id].y = state.players[id].y;
          gameState.players[id].isAlive = state.players[id].isAlive;
        }
      });
    });

    socket.on('gameOver', (data) => {
      document.getElementById('winner-text').innerText = `${data.winner} 승리!`;
      overlay.style.display = 'flex';
    });

    socket.on('returnToLobby', (data) => {
      isGameStarted = false;
      overlay.style.display = 'none';
      gameState.map = data.map;
      gameState.players = data.players;
      updateLobbyUI();
    });

    function onMapChange() {
      socket.emit('selectMap', mapSelect.value);
    }

    function startGame() {
      socket.emit('startGame');
    }

    function requestLobby() {
      socket.emit('restartGame');
    }

    function updateLobbyUI() {
      const me = gameState.players[myId];
      const isHost = me && me.pNum === 1;

      mapSelect.disabled = isGameStarted || !isHost;
      startBtn.disabled = isGameStarted || !isHost;

      if (!isGameStarted) {
        statusDiv.innerText = isHost 
          ? `[방장] 맵을 선택하고 [게임 시작] 버튼을 누르세요.` 
          : `[참가자] 방장이 게임을 시작하기를 기다리는 중...`;
      } else {
        statusDiv.innerText = `게임 진행 중... (당신: Player ${me ? me.pNum : ''})`;
      }
    }

    // 이동 키 세팅
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
      if (e.key === ' ') { socket.emit('placeBomb'); return; }
      if (e.key in keys) keys[e.key] = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key in keys) keys[e.key] = false;
    });

    let lastMoveTime = 0;
    function handleInput() {
      if (!isGameStarted) return;
      const now = Date.now();
      if (now - lastMoveTime < 120) return;

      let dir = null;
      if (keys.ArrowUp) dir = 'up';
      else if (keys.ArrowDown) dir = 'down';
      else if (keys.ArrowLeft) dir = 'left';
      else if (keys.ArrowRight) dir = 'right';

      if (dir) {
        socket.emit('move', dir);
        lastMoveTime = now;
      }
    }

    function clientLoop() {
      handleInput();
      draw();
      requestAnimationFrame(clientLoop);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (gameState.map && gameState.map.length > 0) {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const type = gameState.map[r][c];
            if (type === TILE.SOLID_BLOCK) {
              ctx.fillStyle = '#2b2d42';
              ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            } else if (type === TILE.SOFT_BLOCK) {
              ctx.fillStyle = '#b08968';
              ctx.fillRect(c * TILE_SIZE + 2, r * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
            } else if (type === TILE.BOMB) {
              ctx.fillStyle = '#0077b6';
              ctx.beginPath();
              ctx.arc(c * TILE_SIZE + TILE_SIZE / 2, r * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE / 2.5, 0, Math.PI * 2);
              ctx.fill();
            } else if (type === TILE.ITEM_BOMB || type === TILE.ITEM_RANGE) {
              ctx.fillStyle = type === TILE.ITEM_BOMB ? '#ffb703' : '#fb8500';
              ctx.fillRect(c * TILE_SIZE + 10, r * TILE_SIZE + 10, TILE_SIZE - 20, TILE_SIZE - 20);
            }
          }
        }
      }

      if (gameState.explosions) {
        ctx.fillStyle = '#e63946';
        gameState.explosions.forEach(exp => {
          ctx.fillRect(exp.x * TILE_SIZE, exp.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        });
      }

      if (gameState.players) {
        Object.values(gameState.players).forEach(p => {
          if (!p.isAlive) return;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x * TILE_SIZE + TILE_SIZE / 2, p.y * TILE_SIZE + TILE_SIZE / 2, TILE_SIZE / 3, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 12px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(`P${p.pNum}`, p.x * TILE_SIZE + TILE_SIZE / 2, p.y * TILE_SIZE + TILE_SIZE / 2 + 4);
        });
      }
    }
  </script>
</body>
</html>
