<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Arcade Online 💣</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #fff;
      font-family: 'Jua', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      margin: 5px 0 15px 0;
      font-size: 38px;
      color: #38bdf8;
      text-shadow: 0 4px 0 #0284c7, 0 8px 15px rgba(0,0,0,0.5);
      letter-spacing: 2px;
    }

    #lobby-controls {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      align-items: center;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      padding: 12px 28px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.1);
      border: 2px solid #334155;
    }

    label {
      font-size: 18px;
      color: #f1f5f9;
    }

    select {
      padding: 8px 16px;
      font-size: 16px;
      font-family: 'Jua', sans-serif;
      border-radius: 12px;
      border: 2px solid #3b82f6;
      background: #0f172a;
      color: #38bdf8;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    select:hover {
      border-color: #60a5fa;
    }

    #start-btn {
      padding: 8px 24px;
      font-size: 18px;
      font-family: 'Jua', sans-serif;
      border-radius: 12px;
      border: none;
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 0 #1e40af, 0 6px 15px rgba(59, 130, 246, 0.4);
      transition: all 0.15s ease;
    }

    #start-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #1e40af, 0 8px 20px rgba(59, 130, 246, 0.5);
    }

    #start-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1e40af;
    }

    #start-btn:disabled {
      background: #475569;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }

    #status {
      margin-bottom: 12px;
      font-size: 16px;
      color: #fbbf24;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    #game-container {
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border-radius: 20px;
    }

    #hud {
      display: flex;
      justify-content: space-around;
      width: 600px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 3px solid #334155;
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      padding: 10px 0;
      box-sizing: border-box;
    }

    .hud-card {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      background: #1e293b;
      padding: 6px 18px;
      border-radius: 30px;
      border: 2px solid #334155;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    }

    canvas {
      border: 3px solid #334155;
      display: block;
      border-radius: 0 0 20px 20px;
    }

    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    #winner-text {
      font-size: 42px;
      color: #fbbf24;
      margin-bottom: 25px;
      text-shadow: 0 4px 0 #d97706, 0 8px 20px rgba(251, 191, 36, 0.4);
    }

    .lobby-btn {
      background: linear-gradient(180deg, #10b981 0%, #047857 100%);
      color: white;
      padding: 12px 30px;
      font-size: 20px;
      font-family: 'Jua', sans-serif;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #065f46, 0 6px 20px rgba(16, 185, 129, 0.4);
      transition: all 0.15s ease;
    }

    .lobby-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #065f46, 0 8px 25px rgba(16, 185, 129, 0.5);
    }

    .lobby-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #065f46;
    }
  </style>
</head>
<body>

  <h1>Crazy Arcade Online 💣</h1>

  <div id="lobby-controls">
    <label for="mapSelect">⛺ 맵 선택:</label>
    <select id="mapSelect" onchange="onMapChange()">
      <option value="camp">캠프 (Camp)</option>
      <option value="patrit">패트릿 (Patrit)</option>
      <option value="factory">팩토리 (Factory)</option>
    </select>
    <button id="start-btn" onclick="startGame()">게임 시작</button>
  </div>

  <div id="status">서버 연결 중...</div>

  <div id="game-container">
    <div id="hud">
      <div class="hud-card">💧 물풍선: <span id="hud-bombs" style="color:#60a5fa">1</span></div>
      <div class="hud-card">🔥 물줄기: <span id="hud-range" style="color:#f87171">1</span></div>
      <div class="hud-card">🛼 스피드: <span id="hud-speed" style="color:#34d399">1</span></div>
    </div>

    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <div id="overlay">
      <div id="winner-text">Player 1 승리!</div>
      <button class="lobby-btn" onclick="requestLobby()">대기실로 이동</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const mapSelect = document.getElementById('mapSelect');
    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');
    const overlay = document.getElementById('overlay');

    const ROWS = 15;
    const COLS = 15;
    const TILE_SIZE = canvas.width / COLS;

    const TILE = {
      EMPTY: 0,
      SOLID_BLOCK: 1,
      SOFT_BLOCK: 2,
      BOMB: 3,
      ITEM_BOMB: 4,
      ITEM_RANGE: 5,
      ITEM_SPEED: 6
    };

    let myId = null;
    let isGameStarted = false;
    let gameState = { map: [], players: {}, explosions: [] };

    let localPositions = {};
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    let myActiveBombs = [];

    socket.on('init', (data) => {
      myId = data.id;
      gameState.map = data.map;
      gameState.players = data.players;
      isGameStarted = data.isGameStarted;
      mapSelect.value = data.selectedMap;

      syncLocalPositions();
      updateLobbyUI();
      requestAnimationFrame(clientLoop);
    });

    socket.on('playerJoined', (player) => {
      gameState.players[player.id] = player;
      localPositions[player.id] = { x: player.x * TILE_SIZE, y: player.y * TILE_SIZE };
      updateLobbyUI();
    });

    socket.on('playerLeft', (id) => {
      delete gameState.players[id];
      delete localPositions[id];
      updateLobbyUI();
    });

    socket.on('mapChanged', (data) => {
      mapSelect.value = data.selectedMap;
      gameState.map = data.map;
    });

    socket.on('gameStarted', (data) => {
      isGameStarted = true;
      overlay.style.display = 'none';
      gameState.map = data.map;
      gameState.players = data.players;
      myActiveBombs = [];
      syncLocalPositions();
      updateLobbyUI();
    });

    socket.on('gameState', (state) => {
      gameState.map = state.map;
      gameState.explosions = state.explosions;
      myActiveBombs = myActiveBombs.filter(b => gameState.map[b.r] && gameState.map[b.r][b.c] === TILE.BOMB);

      Object.keys(state.players).forEach(id => {
        if (gameState.players[id]) {
          gameState.players[id].x = state.players[id].x;
          gameState.players[id].y = state.players[id].y;
          gameState.players[id].maxBombs = state.players[id].maxBombs;
          gameState.players[id].bombRange = state.players[id].bombRange;
          gameState.players[id].speed = state.players[id].speed || 1;
          gameState.players[id].isAlive = state.players[id].isAlive;

          if (id !== myId && localPositions[id]) {
            localPositions[id].targetX = state.players[id].x * TILE_SIZE;
            localPositions[id].targetY = state.players[id].y * TILE_SIZE;
          }
        }
      });
      updateHUD();
    });

    socket.on('gameOver', (data) => {
      document.getElementById('winner-text').innerText = `${data.winner} 승리!`;
      overlay.style.display = 'flex';
    });

    socket.on('returnToLobby', (data) => {
      isGameStarted = false;
      overlay.style.display = 'none';
      gameState.map = data.map;
      gameState.players = data.players;
      myActiveBombs = [];
      syncLocalPositions();
      updateLobbyUI();
    });

    function syncLocalPositions() {
      Object.values(gameState.players).forEach(p => {
        localPositions[p.id] = {
          x: p.x * TILE_SIZE,
          y: p.y * TILE_SIZE,
          targetX: p.x * TILE_SIZE,
          targetY: p.y * TILE_SIZE
        };
      });
    }

    function onMapChange() { socket.emit('selectMap', mapSelect.value); }
    function startGame() { socket.emit('startGame'); }
    function requestLobby() { socket.emit('restartGame'); }

    function updateLobbyUI() {
      const me = gameState.players[myId];
      const isHost = me && me.pNum === 1;
      mapSelect.disabled = isGameStarted || !isHost;
      startBtn.disabled = isGameStarted || !isHost;

      if (!isGameStarted) {
        statusDiv.innerText = isHost ? `[방장] 맵을 선택하고 [게임 시작]을 누르세요.` : `[참가자] 방장의 게임 시작을 기다리는 중...`;
      } else {
        statusDiv.innerText = `게임 진행 중 (Player ${me ? me.pNum : ''})`;
      }
    }

    function updateHUD() {
      const me = gameState.players[myId];
      if (me) {
        document.getElementById('hud-bombs').innerText = me.maxBombs;
        document.getElementById('hud-range').innerText = me.bombRange;
        document.getElementById('hud-speed').innerText = me.speed || 1;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
      
      if (e.key === ' ') {
        if (!isGameStarted || !localPositions[myId]) return;
        const myPos = localPositions[myId];
        const centerCol = Math.floor((myPos.x + TILE_SIZE / 2) / TILE_SIZE);
        const centerRow = Math.floor((myPos.y + TILE_SIZE / 2) / TILE_SIZE);

        if (gameState.map[centerRow] && gameState.map[centerRow][centerCol] !== TILE.BOMB) {
          if (!myActiveBombs.some(b => b.r === centerRow && b.c === centerCol)) {
            myActiveBombs.push({ r: centerRow, c: centerCol });
          }
          socket.emit('placeBomb');
        }
        return;
      }

      if (e.key in keys) keys[e.key] = true;
    });

    window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

    let lastServerSyncTime = 0;

    function updateMovement() {
      if (!isGameStarted) return;
      const me = gameState.players[myId];
      if (!me || !me.isAlive || !localPositions[myId]) return;

      const myPos = localPositions[myId];
      const speedLevel = me.speed || 1;
      const moveSpeed = 2.0 + (speedLevel - 1) * 0.5;

      let dx = 0;
      let dy = 0;

      if (keys.ArrowUp) dy -= moveSpeed;
      if (keys.ArrowDown) dy += moveSpeed;
      if (keys.ArrowLeft) dx -= moveSpeed;
      if (keys.ArrowRight) dx += moveSpeed;

      const hitSize = TILE_SIZE * 0.6;
      const margin = (TILE_SIZE - hitSize) / 2;
      checkBombOverlap(myPos.x + margin, myPos.y + margin, hitSize);

      if (dx !== 0 || dy !== 0) {
        let nextX = myPos.x + dx;
        let nextY = myPos.y + dy;

        if (canMoveTo(nextX + margin, myPos.y + margin, hitSize)) {
          myPos.x = nextX;
        }
        if (canMoveTo(myPos.x + margin, nextY + margin, hitSize)) {
          myPos.y = nextY;
        }

        myPos.x = Math.max(0, Math.min(canvas.width - TILE_SIZE, myPos.x));
        myPos.y = Math.max(0, Math.min(canvas.height - TILE_SIZE, myPos.y));

        const now = Date.now();
        if (now - lastServerSyncTime > 80) {
          let dir = null;
          if (keys.ArrowUp) dir = 'up';
          else if (keys.ArrowDown) dir = 'down';
          else if (keys.ArrowLeft) dir = 'left';
          else if (keys.ArrowRight) dir = 'right';

          if (dir) socket.emit('move', dir);
          lastServerSyncTime = now;
        }
      }

      Object.keys(localPositions).forEach(id => {
        if (id !== myId) {
          const pos = localPositions[id];
          if (pos.targetX !== undefined) {
            pos.x += (pos.targetX - pos.x) * 0.35;
            pos.y += (pos.targetY - pos.y) * 0.35;
          }
        }
      });
    }

    function checkBombOverlap(x, y, size) {
      const minCol = Math.floor(x / TILE_SIZE);
      const maxCol = Math.floor((x + size - 1) / TILE_SIZE);
      const minRow = Math.floor(y / TILE_SIZE);
      const maxRow = Math.floor((y + size - 1) / TILE_SIZE);

      myActiveBombs = myActiveBombs.filter(b => {
        const overlaps = (r, c) => r >= minRow && r <= maxRow && c >= minCol && c <= maxCol;
        return overlaps(b.r, b.c);
      });
    }

    function canMoveTo(x, y, size) {
      const minCol = Math.floor(x / TILE_SIZE);
      const maxCol = Math.floor((x + size - 1) / TILE_SIZE);
      const minRow = Math.floor(y / TILE_SIZE);
      const maxRow = Math.floor((y + size - 1) / TILE_SIZE);

      for (let r = minRow; r <= maxRow; r++) {
        for (let c = minCol; c <= maxCol; c++) {
          if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;

          const tile = gameState.map[r] ? gameState.map[r][c] : TILE.SOLID_BLOCK;

          if (tile === TILE.SOLID_BLOCK || tile === TILE.SOFT_BLOCK) {
            return false;
          }

          if (tile === TILE.BOMB) {
            const isInsideMyBomb = myActiveBombs.some(b => b.r === r && b.c === c);
            if (!isInsideMyBomb) return false;
          }
        }
      }
      return true;
    }

    function clientLoop() {
      updateMovement();
      draw();
      requestAnimationFrame(clientLoop);
    }

    // 🎨 맵 배경 렌더링 (테마별)
    function drawBackground() {
      const theme = mapSelect.value;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = c * TILE_SIZE;
          const y = r * TILE_SIZE;

          if (theme === 'camp') {
            // 풀밭 격자 패턴
            ctx.fillStyle = (r + c) % 2 === 0 ? '#4ade80' : '#22c55e';
            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
          } else if (theme === 'patrit') {
            // 사막 도로 패턴
            ctx.fillStyle = (r + c) % 2 === 0 ? '#fb923c' : '#f97316';
            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
          } else if (theme === 'factory') {
            // 팩토리 격자 패턴
            ctx.fillStyle = (r + c) % 2 === 0 ? '#64748b' : '#475569';
            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
          }
        }
      }
    }

    // 🎨 파괴 불가능 블록 (입체 텐트, 바위, 강철)
    function drawSolidBlock(c, r) {
      const x = c * TILE_SIZE;
      const y = r * TILE_SIZE;
      const theme = mapSelect.value;

      if (theme === 'camp') {
        // 캠프 텐트
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.moveTo(x + TILE_SIZE / 2, y + 4);
        ctx.lineTo(x + 4, y + TILE_SIZE - 4);
        ctx.lineTo(x + TILE_SIZE - 4, y + TILE_SIZE - 4);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.moveTo(x + TILE_SIZE / 2, y + 4);
        ctx.lineTo(x + TILE_SIZE - 4, y + TILE_SIZE - 4);
        ctx.lineTo(x + TILE_SIZE / 2, y + TILE_SIZE - 4);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.moveTo(x + TILE_SIZE / 2, y + 16);
        ctx.lineTo(x + TILE_SIZE / 2 - 6, y + TILE_SIZE - 4);
        ctx.lineTo(x + TILE_SIZE / 2 + 6, y + TILE_SIZE - 4);
        ctx.closePath();
        ctx.fill();
      } else if (theme === 'patrit') {
        // 바위 블록
        ctx.fillStyle = '#78350f';
        ctx.beginPath();
        ctx.roundRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4, 10);
        ctx.fill();

        ctx.fillStyle = '#92400e';
        ctx.beginPath();
        ctx.roundRect(x + 4, y + 4, TILE_SIZE - 8, TILE_SIZE - 12, 6);
        ctx.fill();
      } else {
        // 강철 구조물
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);

        ctx.fillStyle = '#334155';
        ctx.fillRect(x + 4, y + 4, TILE_SIZE - 8, TILE_SIZE - 8);

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(x + 8, y + 8, 2, 0, Math.PI * 2);
        ctx.arc(x + TILE_SIZE - 8, y + 8, 2, 0, Math.PI * 2);
        ctx.arc(x + 8, y + TILE_SIZE - 8, 2, 0, Math.PI * 2);
        ctx.arc(x + TILE_SIZE - 8, y + TILE_SIZE - 8, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 🎨 파괴 가능 블록 (통나무, 상자)
    function drawSoftBlock(c, r) {
      const x = c * TILE_SIZE;
      const y = r * TILE_SIZE;
      const theme = mapSelect.value;

      if (theme === 'camp') {
        // 통나무 블록
        ctx.fillStyle = '#a16207';
        ctx.beginPath();
        ctx.roundRect(x + 3, y + 3, TILE_SIZE - 6, TILE_SIZE - 6, 6);
        ctx.fill();

        ctx.fillStyle = '#ca8a04';
        ctx.beginPath();
        ctx.arc(x + TILE_SIZE / 2, y + TILE_SIZE / 2, TILE_SIZE / 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#854d0e';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (theme === 'factory') {
        // 안전 상자
        ctx.fillStyle = '#eab308';
        ctx.fillRect(x + 3, y + 3, TILE_SIZE - 6, TILE_SIZE - 6);

        ctx.strokeStyle = '#854d0e';
        ctx.lineWidth = 3;
        ctx.strokeRect(x + 6, y + 6, TILE_SIZE - 12, TILE_SIZE - 12);
      } else {
        // 나무 상자
        ctx.fillStyle = '#b45309';
        ctx.fillRect(x + 3, y + 3, TILE_SIZE - 6, TILE_SIZE - 6);

        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 3;
        ctx.strokeRect(x + 3, y + 3, TILE_SIZE - 6, TILE_SIZE - 6);

        ctx.beginPath();
        ctx.moveTo(x + 3, y + 3);
        ctx.lineTo(x + TILE_SIZE - 3, y + TILE_SIZE - 3);
        ctx.stroke();
      }
    }

    // 🎨 물풍선 애니메이션 & 그래픽
    function drawBomb(c, r) {
      const x = c * TILE_SIZE + TILE_SIZE / 2;
      const y = r * TILE_SIZE + TILE_SIZE / 2;

      // 둥실둥실 바운스 효과
      const scale = 1 + Math.sin(Date.now() / 150) * 0.05;
      const radius = (TILE_SIZE / 2.5) * scale;

      // 입체 그림자
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.beginPath();
      ctx.ellipse(x, y + radius * 0.8, radius * 0.8, radius * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      // 물풍선 본체 (그라데이션)
      const grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, radius * 0.1, x, y, radius);
      grad.addColorStop(0, '#93c5fd');
      grad.addColorStop(0.4, '#3b82f6');
      grad.addColorStop(1, '#1d4ed8');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();

      // 하이라이트 (빛 반사)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.beginPath();
      ctx.arc(x - radius * 0.35, y - radius * 0.35, radius * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }

    // 🎨 아이템 카드 그래픽
    function drawItem(c, r, bgColor, iconSymbol) {
      const x = c * TILE_SIZE;
      const y = r * TILE_SIZE;
      const pad = 6;
      const size = TILE_SIZE - pad * 2;

      // 카운팅 애니메이션 (상하 흔들림)
      const floatY = Math.sin(Date.now() / 200) * 2;

      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.roundRect(x + pad, y + pad + floatY, size, size, 10);
      ctx.fill();

      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      ctx.font = '22px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(iconSymbol, x + TILE_SIZE / 2, y + TILE_SIZE / 2 + floatY);
    }

    // 🎨 캐릭터 그래픽 (눈망울, 볼터치 연출)
    function drawPlayer(p, pos) {
      const x = pos.x + TILE_SIZE / 2;
      const y = pos.y + TILE_SIZE / 2;
      const radius = TILE_SIZE / 2.6;

      // 발밑 그림자
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.ellipse(x, y + radius * 0.9, radius * 0.8, radius * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      // 캐릭터 몸통 (그라데이션)
      const grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, radius * 0.1, x, y, radius);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.3, p.color);
      grad.addColorStop(1, '#000000');

      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();

      // 테두리
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // 눈 (좌/우)
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(x - 5, y - 2, 2.5, 0, Math.PI * 2);
      ctx.arc(x + 5, y - 2, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // 눈 반사광
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x - 6, y - 3, 1, 0, Math.PI * 2);
      ctx.arc(x + 4, y - 3, 1, 0, Math.PI * 2);
      ctx.fill();

      // 볼터치
      ctx.fillStyle = 'rgba(244, 63, 94, 0.5)';
      ctx.beginPath();
      ctx.arc(x - 9, y + 3, 3, 0, Math.PI * 2);
      ctx.arc(x + 9, y + 3, 3, 0, Math.PI * 2);
      ctx.fill();

      // P1, P2 태그 배지
      ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
      ctx.beginPath();
      ctx.roundRect(x - 12, y - radius - 12, 24, 14, 6);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`P${p.pNum}`, x, y - radius - 5);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground();

      if (gameState.map && gameState.map.length > 0) {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const type = gameState.map[r][c];

            if (type === TILE.SOLID_BLOCK) {
              drawSolidBlock(c, r);
            } else if (type === TILE.SOFT_BLOCK) {
              drawSoftBlock(c, r);
            } else if (type === TILE.BOMB) {
              drawBomb(c, r);
            } else if (type === TILE.ITEM_BOMB) {
              drawItem(c, r, '#2563eb', '💧');
            } else if (type === TILE.ITEM_RANGE) {
              drawItem(c, r, '#dc2626', '🔥');
            } else if (type === TILE.ITEM_SPEED) {
              drawItem(c, r, '#059669', '🛼');
            }
          }
        }
      }

      // 폭발 이펙트 연출
      if (gameState.explosions) {
        ctx.fillStyle = 'rgba(248, 113, 113, 0.85)';
        gameState.explosions.forEach(exp => {
          ctx.beginPath();
          ctx.roundRect(exp.x * TILE_SIZE + 2, exp.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4, 8);
          ctx.fill();
        });
      }

      // 플레이어 연출
      if (gameState.players) {
        Object.values(gameState.players).forEach(p => {
          if (!p.isAlive) return;
          const pos = localPositions[p.id] || { x: p.x * TILE_SIZE, y: p.y * TILE_SIZE };
          drawPlayer(p, pos);
        });
      }
    }
  </script>
