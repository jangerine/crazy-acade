<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Arcade Online 💣</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: 'Jua', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .title-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: 38px;
      color: #38bdf8;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 6px 0 #0284c7;
      letter-spacing: 2px;
    }

    #lobby-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
      background: #1e293b;
      padding: 8px 24px;
      border-radius: 30px;
      border: 3px solid #334155;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    select, button {
      font-family: 'Jua', sans-serif;
      font-size: 16px;
      padding: 6px 16px;
      border-radius: 20px;
      border: none;
      outline: none;
    }
    select {
      background: #0f172a;
      color: #38bdf8;
      border: 2px solid #38bdf8;
      cursor: pointer;
    }
    #start-btn {
      background: linear-gradient(180deg, #facc15 0%, #eab308 100%);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #ca8a04;
      transition: all 0.1s;
    }
    #start-btn:hover:not(:disabled) { transform: translateY(-1px); }
    #start-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #ca8a04; }
    #start-btn:disabled { background: #475569; color: #94a3b8; box-shadow: none; cursor: not-allowed; }

    #status {
      margin-bottom: 10px;
      font-size: 15px;
      color: #facc15;
      text-shadow: 1px 1px 2px #000;
    }

    #arcade-frame {
      display: flex;
      background: #1e293b;
      border: 6px solid #334155;
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      gap: 14px;
    }

    .user-panel {
      width: 135px;
      background: #0f172a;
      border: 3px solid #334155;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .panel-title {
      font-size: 18px;
      color: #38bdf8;
      border-bottom: 2px solid #334155;
      width: 100%;
      text-align: center;
      padding-bottom: 6px;
    }
    .avatar-box {
      width: 75px;
      height: 75px;
      background: #1e293b;
      border: 3px solid #38bdf8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .stat-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 15px;
    }
    .stat-item {
      display: flex;
      justify-content: space-between;
      background: #1e293b;
      padding: 5px 10px;
      border-radius: 10px;
      border: 1px solid #334155;
    }

    #canvas-container {
      position: relative;
      border: 4px solid #0f172a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      background-color: #000;
    }

    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #winner-text {
      font-size: 38px;
      color: #facc15;
      margin-bottom: 20px;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
    }
    .lobby-btn {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: white;
      padding: 10px 26px;
      font-size: 18px;
      font-family: 'Jua', sans-serif;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 0 #0369a1;
    }
  </style>
</head>
<body>

  <div class="title-container">
    <h1>CRAZY ARCADE BnB</h1>
  </div>

  <div id="lobby-controls">
    <label for="mapSelect">⛺ 맵 선택:</label>
    <select id="mapSelect" onchange="onMapChange()">
      <option value="camp">캠프 08 (Camp)</option>
      <option value="patrit">패트릿 14 (Patrit)</option>
      <option value="factory">팩토리 07 (Factory)</option>
    </select>
    <button id="start-btn" onclick="startGame()">START</button>
  </div>

  <div id="status">서버 연결 중...</div>

  <div id="arcade-frame">
    <!-- P1 패널 -->
    <div class="user-panel">
      <div class="panel-title">PLAYER 1</div>
      <div class="avatar-box" id="p1-avatar">🔴</div>
      <div class="stat-list">
        <div class="stat-item"><span>🎈 물풍선</span><span id="p1-bombs" style="color:#60a5fa">1</span></div>
        <div class="stat-item"><span>🔥 물줄기</span><span id="p1-range" style="color:#f87171">1</span></div>
        <div class="stat-item"><span>🛼 스피드</span><span id="p1-speed" style="color:#34d399">1</span></div>
      </div>
    </div>

    <!-- 맵 캔버스 -->
    <div id="canvas-container">
      <canvas id="gameCanvas" width="540" height="540"></canvas>

      <div id="overlay">
        <div id="winner-text">Player 1 승리!</div>
        <button class="lobby-btn" onclick="requestLobby()">대기실로 이동</button>
      </div>
    </div>

    <!-- P2 패널 -->
    <div class="user-panel">
      <div class="panel-title">PLAYER 2</div>
      <div class="avatar-box" id="p2-avatar">🔵</div>
      <div class="stat-list">
        <div class="stat-item"><span>🎈 물풍선</span><span id="p2-bombs" style="color:#60a5fa">1</span></div>
        <div class="stat-item"><span>🔥 물줄기</span><span id="p2-range" style="color:#f87171">1</span></div>
        <div class="stat-item"><span>🛼 스피드</span><span id="p2-speed" style="color:#34d399">1</span></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const mapSelect = document.getElementById('mapSelect');
    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');
    const overlay = document.getElementById('overlay');

    const ROWS = 15;
    const COLS = 15;
    const TILE_SIZE = canvas.width / COLS; // 36px

    const TILE = {
      EMPTY: 0,
      SOLID_BLOCK: 1,
      SOFT_BLOCK: 2,
      BOMB: 3,
      ITEM_BOMB: 4,
      ITEM_RANGE: 5,
      ITEM_SPEED: 6
    };

    let myId = null;
    let isGameStarted = false;
    let gameState = { map: [], players: {}, explosions: [] };

    let localPositions = {};
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    let myActiveBombs = [];

    socket.on('init', (data) => {
      myId = data.id;
      gameState.map = data.map;
      gameState.players = data.players;
      isGameStarted = data.isGameStarted;
      mapSelect.value = data.selectedMap;

      syncLocalPositions();
      updateLobbyUI();
      requestAnimationFrame(clientLoop);
    });

    socket.on('playerJoined', (player) => {
      gameState.players[player.id] = player;
      localPositions[player.id] = { x: player.x * TILE_SIZE, y: player.y * TILE_SIZE };
      updateLobbyUI();
    });

    socket.on('playerLeft', (id) => {
      delete gameState.players[id];
      delete localPositions[id];
      updateLobbyUI();
    });

    socket.on('mapChanged', (data) => {
      mapSelect.value = data.selectedMap;
      gameState.map = data.map;
    });

    socket.on('gameStarted', (data) => {
      isGameStarted = true;
      overlay.style.display = 'none';
      gameState.map = data.map;
      gameState.players = data.players;
      myActiveBombs = [];
      syncLocalPositions();
      updateLobbyUI();
    });

    socket.on('gameState', (state) => {
      gameState.map = state.map;
      gameState.explosions = state.explosions;

      // 사라진 물풍선은 통과 가능 목록에서 제거
      myActiveBombs = myActiveBombs.filter(b => gameState.map[b.r] && gameState.map[b.r][b.c] === TILE.BOMB);

      Object.keys(state.players).forEach(id => {
        if (gameState.players[id]) {
          gameState.players[id].x = state.players[id].x;
          gameState.players[id].y = state.players[id].y;
          gameState.players[id].maxBombs = state.players[id].maxBombs;
          gameState.players[id].bombRange = state.players[id].bombRange;
          gameState.players[id].speed = state.players[id].speed || 1;
          gameState.players[id].isAlive = state.players[id].isAlive;

          if (id !== myId && localPositions[id]) {
            localPositions[id].targetX = state.players[id].x * TILE_SIZE;
            localPositions[id].targetY = state.players[id].y * TILE_SIZE;
          }
        }
      });
      updateHUD();
    });

    socket.on('gameOver', (data) => {
      document.getElementById('winner-text').innerText = `${data.winner} 승리!`;
      overlay.style.display = 'flex';
    });

    socket.on('returnToLobby', (data) => {
      isGameStarted = false;
      overlay.style.display = 'none';
      gameState.map = data.map;
      gameState.players = data.players;
      myActiveBombs = [];
      syncLocalPositions();
      updateLobbyUI();
    });

    function syncLocalPositions() {
      Object.values(gameState.players).forEach(p => {
        localPositions[p.id] = {
          x: p.x * TILE_SIZE,
          y: p.y * TILE_SIZE,
          targetX: p.x * TILE_SIZE,
          targetY: p.y * TILE_SIZE
        };
      });
    }

    function onMapChange() { socket.emit('selectMap', mapSelect.value); }
    function startGame() { socket.emit('startGame'); }
    function requestLobby() { socket.emit('restartGame'); }

    function updateLobbyUI() {
      const me = gameState.players[myId];
      const isHost = me && me.pNum === 1;
      mapSelect.disabled = isGameStarted || !isHost;
      startBtn.disabled = isGameStarted || !isHost;

      if (!isGameStarted) {
        statusDiv.innerText = isHost ? `[방장] 맵을 선택하고 [START] 버튼을 누르세요.` : `[참가자] 방장의 게임 시작을 기다리는 중...`;
      } else {
        statusDiv.innerText = `게임 진행 중 (Player ${me ? me.pNum : ''})`;
      }
    }

    function updateHUD() {
      Object.values(gameState.players).forEach(p => {
        const prefix = `p${p.pNum}`;
        const bEl = document.getElementById(`${prefix}-bombs`);
        const rEl = document.getElementById(`${prefix}-range`);
        const sEl = document.getElementById(`${prefix}-speed`);
        if (bEl) bEl.innerText = p.maxBombs;
        if (rEl) rEl.innerText = p.bombRange;
        if (sEl) sEl.innerText = p.speed || 1;
      });
    }

    // 💣 키보드 이벤트 (스페이스바 즉시 설치)
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === ' ' || e.code === 'Space') {
        if (!isGameStarted || !localPositions[myId]) return;
        const me = gameState.players[myId];
        if (!me || !me.isAlive) return;

        const myPos = localPositions[myId];
        const centerCol = Math.min(COLS - 1, Math.max(0, Math.floor((myPos.x + TILE_SIZE / 2) / TILE_SIZE)));
        const centerRow = Math.min(ROWS - 1, Math.max(0, Math.floor((myPos.y + TILE_SIZE / 2) / TILE_SIZE)));

        // 서버로 폭탄 설치 요청 즉시 전송
        socket.emit('placeBomb');

        // 내 통과 가능 폭탄 목록 등록
        if (!myActiveBombs.some(b => b.r === centerRow && b.c === centerCol)) {
          myActiveBombs.push({ r: centerRow, c: centerCol });
        }
        return;
      }

      if (e.key in keys) keys[e.key] = true;
    });

    window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });

    let lastServerSyncTime = 0;

    function updateMovement() {
      if (!isGameStarted) return;
      const me = gameState.players[myId];
      if (!me || !me.isAlive || !localPositions[myId]) return;

      const myPos = localPositions[myId];
      const speedLevel = me.speed || 1;
      const moveSpeed = 2.0 + (speedLevel - 1) * 0.4;

      const hitSize = TILE_SIZE * 0.65;
      const margin = (TILE_SIZE - hitSize) / 2;

      // 움직이든 안 움직이든 현재 플레이어가 통과 완료한 폭탄 감지
      checkBombOverlap(myPos.x + margin, myPos.y + margin, hitSize);

      let dx = 0;
      let dy = 0;

      if (keys.ArrowUp) dy -= moveSpeed;
      if (keys.ArrowDown) dy += moveSpeed;
      if (keys.ArrowLeft) dx -= moveSpeed;
      if (keys.ArrowRight) dx += moveSpeed;

      if (dx !== 0 || dy !== 0) {
        let nextX = myPos.x + dx;
        let nextY = myPos.y + dy;

        if (canMoveTo(nextX + margin, myPos.y + margin, hitSize)) {
          myPos.x = nextX;
        }
        if (canMoveTo(myPos.x + margin, nextY + margin, hitSize)) {
          myPos.y = nextY;
        }

        myPos.x = Math.max(0, Math.min(canvas.width - TILE_SIZE, myPos.x));
        myPos.y = Math.max(0, Math.min(canvas.height - TILE_SIZE, myPos.y));

        const now = Date.now();
        if (now - lastServerSyncTime > 60) {
          let dir = null;
          if (keys.ArrowUp) dir = 'up';
          else if (keys.ArrowDown) dir = 'down';
          else if (keys.ArrowLeft) dir = 'left';
          else if (keys.ArrowRight) dir = 'right';

          if (dir) socket.emit('move', dir);
          lastServerSyncTime = now;
        }
      }

      // 타 플레이어 위치 보정
      Object.keys(localPositions).forEach(id => {
        if (id !== myId) {
          const pos = localPositions[id];
          if (pos.targetX !== undefined) {
            pos.x += (pos.targetX - pos.x) * 0.35;
            pos.y += (pos.targetY - pos.y) * 0.35;
          }
        }
      });
    }

    function checkBombOverlap(x, y, size) {
      const minCol = Math.floor(x / TILE_SIZE);
      const maxCol = Math.floor((x + size - 1) / TILE_SIZE);
      const minRow = Math.floor(y / TILE_SIZE);
      const maxRow = Math.floor((y + size - 1) / TILE_SIZE);

      // 플레이어가 해당 폭탄 타일을 완전히 벗어나는 순간 통과 가능 목록에서 빠짐
      myActiveBombs = myActiveBombs.filter(b => {
        const overlaps = (r, c) => r >= minRow && r <= maxRow && c >= minCol && c <= maxCol;
        return overlaps(b.r, b.c);
      });
    }

    function canMoveTo(x, y, size) {
      const minCol = Math.floor(x / TILE_SIZE);
      const maxCol = Math.floor((x + size - 1) / TILE_SIZE);
      const minRow = Math.floor(y / TILE_SIZE);
      const maxRow = Math.floor((y + size - 1) / TILE_SIZE);

      for (let r = minRow; r <= maxRow; r++) {
        for (let c = minCol; c <= maxCol; c++) {
          if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;

          const tile = gameState.map[r] ? gameState.map[r][c] : TILE.SOLID_BLOCK;

          if (tile === TILE.SOLID_BLOCK || tile === TILE.SOFT_BLOCK) return false;

          if (tile === TILE.BOMB) {
            const isInsideMyBomb = myActiveBombs.some(b => b.r === r && b.c === c);
            if (!isInsideMyBomb) return false;
          }
        }
      }
      return true;
    }

    function clientLoop() {
      updateMovement();
      draw();
      requestAnimationFrame(clientLoop);
    }

    function drawBackground() {
      const theme = mapSelect.value;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = c * TILE_SIZE;
          const y = r * TILE_SIZE;

          if (theme === 'camp') {
            ctx.fillStyle = (r + c) % 2 === 0 ? '#52b788' : '#40916c';
          } else if (theme === 'patrit') {
            ctx.fillStyle = (r + c) % 2 === 0 ? '#f4a261' : '#e76f51';
          } else {
            ctx.fillStyle = (r + c) % 2 === 0 ? '#475569' : '#334155';
          }
          ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
        }
      }
    }

    function drawSolidBlock(c, r) {
      const x = c * TILE_SIZE;
      const y = r * TILE_SIZE;
      const theme = mapSelect.value;

      if (theme === 'camp') {
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.moveTo(x + TILE_SIZE / 2, y + 2);
        ctx.lineTo(x + 2, y + TILE_SIZE - 2);
        ctx.lineTo(x + TILE_SIZE - 2, y + TILE_SIZE - 2);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(x + TILE_SIZE / 2 - 3, y + TILE_SIZE / 2, 6, TILE_SIZE / 2 - 2);
      } else if (theme === 'patrit') {
        ctx.fillStyle = '#78350f';
        ctx.beginPath();
        ctx.roundRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4, 8);
        ctx.fill();
        ctx.fillStyle = '#92400e';
        ctx.beginPath();
        ctx.arc(x + TILE_SIZE / 2, y + TILE_SIZE / 2, TILE_SIZE / 3, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 5, y + 5, TILE_SIZE - 10, TILE_SIZE - 10);
      }
    }

    function drawSoftBlock(c, r) {
      const x = c * TILE_SIZE;
      const y = r * TILE_SIZE;
      const theme = mapSelect.value;

      if (theme === 'camp') {
        ctx.fillStyle = '#ca8a04';
        ctx.beginPath();
        ctx.roundRect(x + 3, y + 3, TILE_SIZE - 6, TILE_SIZE - 6, 6);
        ctx.fill();
        ctx.strokeStyle = '#854d0e';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.fillStyle = '#d97706';
        ctx.fillRect(x + 3, y + 3, TILE_SIZE - 6, TILE_SIZE - 6);
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x + 3, y + 3, TILE_SIZE - 6, TILE_SIZE - 6);
        ctx.beginPath();
        ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + TILE_SIZE - 3, y + TILE_SIZE - 3);
        ctx.stroke();
      }
    }

    function drawBomb(c, r) {
      const x = c * TILE_SIZE + TILE_SIZE / 2;
      const y = r * TILE_SIZE + TILE_SIZE / 2;
      const scale = 1 + Math.sin(Date.now() / 120) * 0.08;
      const radius = (TILE_SIZE / 2.3) * scale;

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(x, y + radius * 0.7, radius * 0.8, radius * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      const grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, radius * 0.1, x, y, radius);
      grad.addColorStop(0, '#60a5fa');
      grad.addColorStop(0.5, '#3b82f6');
      grad.addColorStop(1, '#1d4ed8');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#93c5fd';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x - radius * 0.35, y - radius * 0.35, radius * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawItem(c, r, bgColor, symbol) {
      const x = c * TILE_SIZE;
      const y = r * TILE_SIZE;
      const floatY = Math.sin(Date.now() / 180) * 2;

      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.roundRect(x + 4, y + 4 + floatY, TILE_SIZE - 8, TILE_SIZE - 8, 8);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(symbol, x + TILE_SIZE / 2, y + TILE_SIZE / 2 + floatY);
    }

    function drawPlayer(p, pos) {
      const x = pos.x + TILE_SIZE / 2;
      const y = pos.y + TILE_SIZE / 2;
      const radius = TILE_SIZE / 2.4;

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(x, y + radius * 0.8, radius * 0.7, radius * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#ffe0bd';
      ctx.beginPath();
      ctx.arc(x, y + 2, radius * 0.65, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(x - 5, y, 2.5, 0, Math.PI * 2);
      ctx.arc(x + 5, y, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(x - 8, y + 4, 2.5, 0, Math.PI * 2);
      ctx.arc(x + 8, y + 4, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();

      if (gameState.map && gameState.map.length > 0) {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const type = gameState.map[r][c];
            if (type === TILE.SOLID_BLOCK) drawSolidBlock(c, r);
            else if (type === TILE.SOFT_BLOCK) drawSoftBlock(c, r);
            else if (type === TILE.BOMB) drawBomb(c, r);
            else if (type === TILE.ITEM_BOMB) drawItem(c, r, '#2563eb', '🎈');
            else if (type === TILE.ITEM_RANGE) drawItem(c, r, '#dc2626', '🔥');
            else if (type === TILE.ITEM_SPEED) drawItem(c, r, '#059669', '🛼');
          }
        }
      }

      if (gameState.explosions) {
        ctx.fillStyle = 'rgba(56, 189, 248, 0.85)';
        gameState.explosions.forEach(exp => {
          ctx.beginPath();
          ctx.roundRect(exp.x * TILE_SIZE + 2, exp.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4, 6);
          ctx.fill();
        });
      }

      if (gameState.players) {
        Object.values(gameState.players).forEach(p => {
          if (!p.isAlive) return;
          const pos = localPositions[p.id] || { x: p.x * TILE_SIZE, y: p.y * TILE_SIZE };
          drawPlayer(p, pos);
        });
      }
    }
  </script>
